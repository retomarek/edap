<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap">
<!-- README banner (1280x320) in the style of the book logo: paper texture and cup are cropped from
     edap/images/logo_big.png (1536x1024), the text is real text. Rendered by
     scripts/render_branding.py into docs/banner.png. -->
<style>
html,body{margin:0;width:1280px;height:320px;overflow:hidden}
/* Paper: the clean top strip of logo_big.png (y 0-255), stretched vertically along its fibres. */
body{background:#d8bba3 url(../edap/images/logo_big.png) no-repeat;background-size:1536px 1285px;background-position:-128px 0;
  font-family:Lexend,sans-serif;color:#333536;display:flex;align-items:center;gap:36px;padding:0 64px 0 58px;box-sizing:border-box}
/* Cup with handle: x 130-612, y 240-665 of logo_big.png; a round mask around the cup and one around
   the handle fade its surroundings into the paper. */
.cup{flex:none;width:482px;height:425px;zoom:.66;background:url(../edap/images/logo_big.png) no-repeat -130px -240px;
  -webkit-mask-image:radial-gradient(circle at 215px 210px,#000 196px,transparent 232px),radial-gradient(64px 58px at 412px 296px,#000 75%,transparent 100%);
  mask-image:radial-gradient(circle at 215px 210px,#000 196px,transparent 232px),radial-gradient(64px 58px at 412px 296px,#000 75%,transparent 100%)}
.text{display:flex;flex-direction:column;min-width:0}
h1{margin:0;font-size:104px;font-weight:600;letter-spacing:-2px;line-height:.95;color:#333536}
.tag{margin:6px 0 0 4px;font-size:33px;font-weight:400;color:#262626;letter-spacing:-.2px;white-space:nowrap}
.chips{display:flex;gap:10px;margin:22px 0 0 4px;flex-wrap:nowrap}
.chip{font-size:17px;font-weight:500;padding:6px 14px;border-radius:999px;background:rgba(255,250,243,.55);border:1.5px solid;white-space:nowrap}
.c1{border-color:#6f4a2a;color:#5a3a1f}.c2{border-color:#b8691f;color:#8f4f14}.c3{border-color:#7d7a35;color:#5c5a22}.c4{border-color:#4a4c4e;color:#333536}
</style></head><body>
<div class="cup" role="img" aria-label="Coffee cup with Python latte art"></div>
<div class="text">
  <h1>edap</h1>
  <div class="tag">Energy Data Analysis with Python</div>
  <div class="chips"><span class="chip c1">Online book with notebooks</span><span class="chip c2">pandas &amp; Plotly</span><span class="chip c3">Comfort &amp; Mollier h,x</span><span class="chip c4">Built on pyedautils</span></div>
</div>
</body></html>
