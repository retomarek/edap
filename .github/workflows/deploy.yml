name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "edap/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  # Pull requests and a weekly run only build the book (all notebooks executed), so
  # broken notebooks and changed data sources show up before the next deploy.
  pull_request:
    paths:
      - "edap/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium

      # Notebooks are executed once: the first build stores the outputs in
      # edap/_build/.jupyter_cache (execute_notebooks: cache), the second reuses them.
      # The runner starts empty, so every run executes against the live data sources.
      - name: Build Jupyter Book (PDF)
        if: env.DEPLOY == 'true'
        run: |
          jupyter-book build edap/ --builder pdfhtml
          mkdir -p edap/_build/pdf_tmp
          cp edap/_build/pdf/book.pdf edap/_build/pdf_tmp/edap.pdf

      - name: Build Jupyter Book (HTML)
        run: |
          # Without a deploy, any warning (e.g. a notebook that fails to execute) fails the run
          if [ "$DEPLOY" = "true" ]; then jupyter-book build edap/; else jupyter-book build edap/ -W --keep-going; fi
          if [ -f edap/_build/pdf_tmp/edap.pdf ]; then cp edap/_build/pdf_tmp/edap.pdf edap/_build/html/edap.pdf; fi

      - name: Upload artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: edap/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
